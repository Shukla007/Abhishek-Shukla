  <!-- oneko.js — the cat that chases the cursor. Only loaded where there is a
       cursor to chase (no point animating it on phones). Delete to remove it. -->
  <script>
    if (matchMedia('(pointer: fine)').matches) {
      var s = document.createElement('script');
      s.src = 'js/oneko.js';
      s.dataset.cat = 'assets/oneko.gif';
      document.body.append(s);
    }
